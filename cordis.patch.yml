# 本插件作为 bundle 的插入清单。
#
# 装法：`dsh plugin --profile web add file:<本目录绝对路径>`
#   CLI 看到 package.json 里有 dsh.bundle.patch，会把包名自动追加进
#   dsh.profile.bundles，并自动带上这一行。
#
# ⚠️ `file:` 安装路径不能含空格（`dsh plugin` 会转发给 pnpm，参数在空格处断开）。
#    本包在开发目录里带空格，安装前先复制到无空格路径，例如
#    D:\dsh-plugins\dsh-plugin-dm-security
#
# 配置项（都可在行里覆盖）：
#   host            数据库服务器 IP
#   port            端口（DMDSC 常见 7236/7237，单实例 5236）
#   user            账号，默认 SYSDBA（P0 全部检查项只需 SYSDBA 只读权限）
#   credentialRef   凭据库里的引用名（**可选**）。常规用法是每次在调用卡片里现填
#                   password，不保存、不落盘；只有不想让口令进会话日志时才配凭据库。
#                   无论哪种用法，都**不要把口令写进这个配置文件**。
#   driver          jdbc（默认）| demo（内置样例数据，不连库）
#   home            工作目录，默认 ~/.dsh/dm-security
#                   （达梦 JDBC 驱动放在 <home>/drivers 下）
#   driverJar       直接指定驱动 jar 路径
#   javaHome        JDK 路径（需要 javac 编译桥）
#   outDir          HTML 报告输出目录，默认 <home>/dm-security-reports
#   timeoutSec      单次查询超时，默认 180
#
# 评估阈值（也可在调用时覆盖，属业务决策）：
#   pwdPolicyMin / pwdMinLen / pwdLifeMaxDays / failedLoginMax /
#   maxSessionsWarnPct / sessionShareWarn
#
# 例：
#   - insert:
#       - id: dm-security
#         name: 'dsh-plugin-dm-security'
#         config:
#           host: 10.0.0.40
#           port: 5236
#           user: sysdba
#           # password 不写在这里；每次在调用卡片里填
#           # credentialRef: dm_security_PASSWORD   # 用凭据库时才需要
- insert:
    - id: dm-security
      name: 'dsh-plugin-dm-security'
